<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>교재 장보기 목록 · 리디튜드</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#fff; --ink:#1c1e21; --ink-soft:#5b6169; --ink-faint:#8b929b;
    --border:#e4e7eb; --accent:#2d6cdf; --done:#129d6f;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#16181c; --surface:#1f2228; --ink:#eceef1; --ink-soft:#aab1ba; --ink-faint:#7d858f; --border:#2f343c}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;padding:20px 16px 60px}
  .wrap{max-width:640px;margin:0 auto}
  header{margin-bottom:18px}
  .eyebrow{font-size:12.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.04em}
  h1{font-size:22px;margin:4px 0 6px}
  .sum{color:var(--ink-soft);font-size:14px}
  .sum b{color:var(--ink)}
  .bar{display:flex;gap:8px;margin:14px 0 4px}
  button{font:inherit;font-weight:650;border:1px solid var(--border);background:var(--surface);
         color:var(--ink);border-radius:9px;padding:9px 14px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  ul{list-style:none;padding:0;margin:16px 0 0;border:1px solid var(--border);
     border-radius:13px;overflow:hidden;background:var(--surface)}
  li{border-top:1px solid var(--border);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
  li:first-child{border-top:none}
  li.on .book{text-decoration:line-through;color:var(--ink-faint)}
  input[type=checkbox]{width:20px;height:20px;margin:1px 0 0;accent-color:var(--done);flex:none}
  .body{flex:1;min-width:0}
  .book{font-weight:700;font-size:15.5px;line-height:1.35;word-break:break-word}
  .who{color:var(--ink-soft);font-size:13.5px;margin-top:4px;line-height:1.5}
  .n{flex:none;font-weight:800;font-size:15px;color:var(--accent);
     background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:7px;padding:3px 9px}
  .msg{color:var(--ink-soft);font-size:14.5px;padding:28px 4px;text-align:center;line-height:1.7}
  footer{margin-top:20px;color:var(--ink-faint);font-size:12.5px;text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">리디튜드 · 조교</div>
    <h1>교재 장보기 목록</h1>
    <div class="sum" id="sum">불러오는 중…</div>
  </header>

  <div class="bar">
    <button class="primary" id="reload">다시 불러오기</button>
    <button id="copy">텍스트로 복사</button>
  </div>

  <div id="out"></div>

  <footer>
    체크는 이 기기에만 저장됩니다. 실제 구매 상태는 노션 <b>교재비 관리</b>의 <b>구매 상태</b>에 적어 주세요.<br>
    구매완료로 바꾸면 이 목록에서 사라집니다.
  </footer>
</div>

<script>
  const token = localStorage.getItem('teacher_auth_token');
  const out = document.getElementById('out');
  const sum = document.getElementById('sum');
  let 목록 = [];

  // 체크 상태는 서버에 저장하지 않는다. 장보는 중에만 쓰는 임시 표시다.
  const KEY = 'shopping_checked';
  const checked = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
  const saveChecked = () => localStorage.setItem(KEY, JSON.stringify([...checked]));

  function render() {
    if (!목록.length) {
      out.innerHTML = '<div class="msg">지금 사야 할 교재가 없습니다.</div>';
      return;
    }
    const ul = document.createElement('ul');
    for (const i of 목록) {
      const li = document.createElement('li');
      if (checked.has(i.교재)) li.className = 'on';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = checked.has(i.교재);
      cb.addEventListener('change', () => {
        cb.checked ? checked.add(i.교재) : checked.delete(i.교재);
        li.classList.toggle('on', cb.checked);
        saveChecked();
      });
      const body = document.createElement('div');
      body.className = 'body';
      const book = document.createElement('div');
      book.className = 'book';
      book.textContent = i.교재;
      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = i.학생들.join(' · ');
      body.append(book, who);
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = i.권수 + '권';
      li.append(cb, body, n);
      ul.append(li);
    }
    out.replaceChildren(ul);
  }

  async function load() {
    if (!token) {
      sum.textContent = '';
      out.innerHTML = '<div class="msg">선생님 아이디로 로그인이 필요합니다.<br>리디플랜에 로그인한 뒤 다시 열어 주세요.</div>';
      return;
    }
    sum.textContent = '불러오는 중…';
    try {
      const r = await fetch('/api/textbook/shopping-list', { headers: { Authorization: 'Bearer ' + token } });
      const j = await r.json();
      if (!j.success) throw new Error(j.message || '실패');
      목록 = j.items || [];
      sum.innerHTML = `교재 <b>${j.총권수}권</b> · 신청 <b>${j.건수}건</b>`;
      render();
    } catch (e) {
      sum.textContent = '';
      out.innerHTML = '<div class="msg">불러오지 못했습니다.<br>' + e.message + '</div>';
    }
  }

  document.getElementById('reload').addEventListener('click', load);
  document.getElementById('copy').addEventListener('click', async () => {
    const text = 목록.map(i => `${i.교재}  ${i.권수}권\n   ${i.학생들.join(' ')}`).join('\n');
    try { await navigator.clipboard.writeText(text || '사야 할 교재 없음'); alert('복사했습니다'); }
    catch { alert('복사에 실패했습니다'); }
  });

  load();
</script>
</body>
</html>
