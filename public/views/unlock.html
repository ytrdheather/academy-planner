<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d9488">
<title>로그인 잠금 풀기 · 리디튜드</title>
<style>
  :root{
    --bg:#f4f7f7; --surface:#ffffff; --surface-2:#eef3f3;
    --ink:#17242e; --ink-soft:#485a68; --ink-faint:#7b8b98;
    --border:#e0e8ea; --border-strong:#cdd9db;
    --accent:#0d9488; --accent-ink:#0a6c62; --accent-wash:#e4f3f0;
    --warn:#a15b06; --warn-wash:#fdf0dd; --warn-border:#f4d9b0;
    --shadow:0 1px 2px rgba(20,40,55,.04),0 6px 20px rgba(20,40,55,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e161b; --surface:#161f26; --surface-2:#1c272f;
      --ink:#e7eef2; --ink-soft:#a7b7c2; --ink-faint:#6d7f8c;
      --border:#243139; --border-strong:#31424c;
      --accent:#2dd4bf; --accent-ink:#7ee7d8; --accent-wash:rgba(45,212,191,.12);
      --warn:#f0b657; --warn-wash:rgba(240,182,87,.12); --warn-border:rgba(240,182,87,.28);
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
    line-height:1.6; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px; margin:0 auto; padding:22px 16px 60px}
  .top{text-align:center; padding:4px 0 14px}
  h1{font-size:21px; margin:0 0 6px; letter-spacing:-.4px}
  .lede{margin:0; color:var(--ink-soft); font-size:14.5px}
  .who{display:flex; align-items:center; gap:8px; justify-content:center; margin-top:10px;
       color:var(--ink-faint); font-size:13px}
  .who button{padding:4px 10px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit;
       border-radius:8px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-soft)}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px;
        padding:16px; margin:14px 0; box-shadow:var(--shadow)}
  h2{font-size:16.5px; margin:0 0 4px; letter-spacing:-.3px}
  .sub{margin:0 0 12px; color:var(--ink-faint); font-size:13.5px}

  .row{display:flex; align-items:center; gap:11px; padding:12px 0; border-top:1px solid var(--border)}
  .row:first-of-type{border-top:0; padding-top:2px}
  .row .rid{flex:1; min-width:0}
  .row .rid b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:15px; word-break:break-all}
  .row .rid div{font-size:12.5px; color:var(--ink-faint)}
  .row button{flex:none; padding:8px 13px; font-size:13.5px; font-weight:700; cursor:pointer;
       font-family:inherit; border-radius:9px; border:1px solid var(--accent-ink);
       background:var(--surface); color:var(--accent-ink)}
  .row button:disabled{border-color:var(--border-strong); color:var(--ink-faint); cursor:not-allowed}

  .empty{color:var(--ink-faint); font-size:14px; text-align:center; padding:18px 0}

  label.fl{display:block; font-size:13px; font-weight:700; color:var(--ink-faint); margin-bottom:5px}
  input[type=text]{width:100%; padding:11px 12px; font-size:15.5px; font-family:inherit;
      border-radius:10px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink)}
  input[type=text]:focus{outline:2px solid var(--accent); outline-offset:-1px}

  .btn{display:block; width:100%; text-align:center; margin-top:10px;
      background:var(--accent-ink); color:#fff; font-weight:800; font-size:15.5px; font-family:inherit;
      padding:13px; border-radius:12px; border:0; cursor:pointer; box-shadow:var(--shadow)}
  .btn.ghost{background:var(--surface); color:var(--accent-ink); border:1px solid var(--border-strong);
      box-shadow:none; font-size:14.5px; padding:11px}
  @media (prefers-color-scheme:dark){ .btn{background:var(--accent); color:#0e161b}
      .btn.ghost{background:var(--surface); color:var(--accent-ink)} }

  .note{border:1px solid var(--warn-border); background:var(--warn-wash); color:var(--warn);
        border-radius:12px; padding:12px 14px; font-size:13.5px; margin:12px 0 0}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px;
    font-size:14px; font-weight:700; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9}
  .toast.show{opacity:.95}
  #app[hidden]{display:none}
  .gate{text-align:center; color:var(--ink-faint); font-size:14.5px; padding:60px 16px}
</style>
</head>
<body>
<div class="gate" id="gate">확인 중…</div>
<div class="wrap" id="app" hidden>

  <div class="top">
    <h1>로그인 잠금 풀기</h1>
    <p class="lede">비밀번호를 여러 번 틀려 잠긴 학생을 바로 풀어줍니다.</p>
    <div class="who"><span id="whoName"></span><button onclick="logout()">로그아웃</button></div>
  </div>

  <div class="card">
    <h2>지금 잠긴 학생</h2>
    <p class="sub" id="rule">불러오는 중…</p>
    <div id="list"><div class="empty">불러오는 중…</div></div>
    <button class="btn ghost" onclick="load()">새로고침</button>
  </div>

  <div class="card">
    <h2>아이디로 직접 풀기</h2>
    <p class="sub">목록에 없어도 학생 아이디를 적어 풀 수 있습니다. 잠기지 않은 아이디를 넣어도 문제되지 않습니다.</p>
    <label class="fl" for="manual">학생 아이디</label>
    <input type="text" id="manual" placeholder="예) readitude263" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn" onclick="unlockManual()">이 아이디 풀어주기</button>
    <div class="note">
      <b>10분이 지나면 저절로 풀립니다.</b> 이 화면은 학생이 지금 당장 들어가야 할 때만 쓰시면 됩니다.
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
/* ── 선생님 로그인 확인 ── */
(function gate(){
  var token = localStorage.getItem('teacher_auth_token');
  if (!token) return toLogin();

  fetch('/api/teacher/user-info', { headers: { Authorization: 'Bearer ' + token } })
    .then(function(r){ if (!r.ok) throw new Error('unauthorized'); return r.json(); })
    .then(function(u){
      document.getElementById('gate').hidden = true;
      document.getElementById('app').hidden = false;
      document.getElementById('whoName').textContent = (u.userName || '선생님') + ' 님';
      load();
    })
    .catch(function(){
      localStorage.removeItem('teacher_auth_token');
      toLogin();
    });

  function toLogin(){ location.replace('/teacher-login?next=/unlock'); }
})();

function logout(){
  localStorage.removeItem('teacher_auth_token');
  location.replace('/teacher-login?next=/unlock');
}

function auth(){ return { Authorization: 'Bearer ' + localStorage.getItem('teacher_auth_token') }; }

function load(){
  fetch('/api/teacher/locked-accounts', { headers: auth() })
    .then(function(r){ if (!r.ok) throw new Error('fail'); return r.json(); })
    .then(function(d){
      document.getElementById('rule').textContent =
        '비밀번호를 ' + d.maxFails + '번 틀리면 ' + d.lockMinutes + '분 동안 잠깁니다.';
      var box = document.getElementById('list');
      box.innerHTML = '';
      if (!d.locked.length) {
        box.innerHTML = '<div class="empty">지금 잠긴 학생이 없습니다.</div>';
        return;
      }
      d.locked.forEach(function(x){
        var row = document.createElement('div');
        row.className = 'row';

        var info = document.createElement('div');
        info.className = 'rid';
        var idEl = document.createElement('b');
        idEl.textContent = x.studentId;
        var meta = document.createElement('div');
        meta.textContent = x.fails + '번 실패 · ' + x.minutesLeft + '분 뒤 자동 해제';
        info.appendChild(idEl);
        info.appendChild(meta);

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '풀어주기';
        btn.onclick = function(){ unlock(x.studentId, btn); };

        row.appendChild(info);
        row.appendChild(btn);
        box.appendChild(row);
      });
    })
    .catch(function(){
      document.getElementById('list').innerHTML = '<div class="empty">불러오지 못했습니다.</div>';
    });
}

function unlock(studentId, btn){
  if (btn) { btn.disabled = true; btn.textContent = '푸는 중…'; }
  fetch('/api/teacher/unlock-account', {
    method: 'POST',
    headers: Object.assign({ 'Content-Type': 'application/json' }, auth()),
    body: JSON.stringify({ studentId: studentId })
  })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
    .then(function(res){
      if (!res.ok) throw new Error(res.d.error || '실패');
      toast(studentId + ' 잠금을 풀었어요');
      load();
    })
    .catch(function(e){
      toast(e.message || '풀지 못했어요');
      if (btn) { btn.disabled = false; btn.textContent = '풀어주기'; }
    });
}

function unlockManual(){
  var v = document.getElementById('manual').value.trim();
  if (!v) { toast('학생 아이디를 적어 주세요'); return; }
  unlock(v, null);
  document.getElementById('manual').value = '';
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1800);
}
</script>
</body>
</html>
