<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d9488">
<title>리디튜드 안내 · 공지사항</title>
<style>
  :root{
    --bg:#f4f7f7; --surface:#ffffff; --surface-2:#eef3f3;
    --ink:#17242e; --ink-soft:#485a68; --ink-faint:#7b8b98;
    --border:#e0e8ea; --border-strong:#cdd9db;
    --accent:#0d9488; --accent-ink:#0a6c62; --accent-wash:#e4f3f0;
    --warn:#a15b06; --warn-wash:#fdf0dd; --warn-border:#f4d9b0;
    --shadow:0 1px 2px rgba(20,40,55,.04),0 6px 20px rgba(20,40,55,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e161b; --surface:#161f26; --surface-2:#1c272f;
      --ink:#e7eef2; --ink-soft:#a7b7c2; --ink-faint:#6d7f8c;
      --border:#243139; --border-strong:#31424c;
      --accent:#2dd4bf; --accent-ink:#7ee7d8; --accent-wash:rgba(45,212,191,.12);
      --warn:#f0b657; --warn-wash:rgba(240,182,87,.12); --warn-border:rgba(240,182,87,.28);
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  [hidden]{display:none!important}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;
    line-height:1.62; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px; margin:0 auto; padding:22px 16px 56px}

  .top{text-align:center; padding:6px 0 18px}
  h1{font-size:23px; margin:0 0 6px; letter-spacing:-.4px}
  .lede{margin:0; color:var(--ink-soft); font-size:15px}

  section{margin:22px 0 0}
  h2{font-size:17px; margin:0 0 10px; letter-spacing:-.3px; display:flex; align-items:center; gap:7px}
  h2 .ico{font-size:18px}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px;
        padding:14px 16px; margin:10px 0; box-shadow:var(--shadow)}

  /* 신청 버튼 */
  /* 링크가 아직 없는 항목은 <div>로 그려지므로 a 로 한정하지 않는다 */
  .form{display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; margin:10px 0; box-shadow:var(--shadow)}
  a.form:active{background:var(--surface-2)}
  .form .t{font-weight:700; font-size:15.5px}
  .form .d{color:var(--ink-faint); font-size:13.5px; margin-top:1px}
  .form .go{margin-left:auto; color:var(--accent-ink); font-weight:800; font-size:18px}
  .form.off{opacity:.55}
  .form.off .go{font-size:12.5px; font-weight:700; color:var(--ink-faint)}

  /* 학사일정 — 직접 그리는 달력 */
  .calnav{display:flex; align-items:center; justify-content:center; gap:10px; margin:0 0 8px}
  .calnav button{font-family:inherit; font-size:15px; cursor:pointer; padding:5px 11px;
    border-radius:9px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-soft)}
  .calnav button:disabled{opacity:.35; cursor:default}
  .calnav .m{font-weight:800; font-size:15.5px; min-width:118px; text-align:center}
  .calbox{background:var(--surface); border:1px solid var(--border); border-radius:14px;
          box-shadow:var(--shadow); overflow:hidden}
  .calbox svg{display:block; width:100%; height:auto}

  /* 학사일정 — 달력 이미지 */
  .cal{display:block; border:1px solid var(--border); border-radius:14px; overflow:hidden;
       box-shadow:var(--shadow); background:var(--surface)}
  .cal img{display:block; width:100%; height:auto}
  .calcap{color:var(--ink-faint); font-size:12.5px; text-align:center; margin:7px 0 0}

  /* 학사일정 — 날짜 목록 */
  .sch{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--border)}
  .sch:last-child{border-bottom:0}
  .sch .when{flex:0 0 84px; color:var(--accent-ink); font-weight:800; font-size:13.5px; padding-top:1px}
  .sch .what{font-size:15px}
  .sch .memo{color:var(--ink-faint); font-size:13.5px; margin-top:1px}
  .sch.today .when::after{content:'오늘'; display:inline-block; margin-left:5px; padding:0 5px;
    border-radius:5px; background:var(--accent-ink); color:#fff; font-size:11px}

  /* 공지·뉴스 */
  .post .h{display:flex; align-items:center; gap:7px; margin-bottom:3px}
  .tag{display:inline-block; padding:1px 7px; border-radius:999px; font-size:11.5px; font-weight:800;
       background:var(--accent-wash); color:var(--accent-ink)}
  .tag.news{background:var(--warn-wash); color:var(--warn)}
  .tag.off{background:var(--warn-wash); color:var(--warn); margin-right:6px}
  .tag.ev{background:var(--accent-wash); color:var(--accent-ink); margin-right:6px}
  /* 보강은 달력 점 색(#ef9ec4)과 맞춰 학부모가 위아래를 같은 것으로 읽게 한다 */
  .tag.mk{background:#fce4ee; color:#b03a68; margin-right:6px}
  /* 시험기간도 달력 색(#8fb4e6)과 맞춘다 */
  .tag.ex{background:#e3edfb; color:#2f5f9e; margin-right:6px}
  @media (prefers-color-scheme:dark){.tag.mk{background:rgba(239,158,196,.16); color:#f2a8c8}
    .tag.ex{background:rgba(143,180,230,.16); color:#a9c7ef}}
  .post .t{font-weight:700; font-size:15.5px; letter-spacing:-.2px}
  .post .date{color:var(--ink-faint); font-size:12.5px; margin-left:auto; flex:0 0 auto}
  .post .b{color:var(--ink-soft); font-size:14.5px; white-space:pre-wrap; margin-top:5px}
  .post a.more{display:inline-block; margin-top:8px; color:var(--accent-ink); font-weight:700; font-size:14px}

  /* FAQ */
  details.faq{background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:0; margin:8px 0; box-shadow:var(--shadow); overflow:hidden}
  details.faq summary{list-style:none; cursor:pointer; padding:13px 16px; font-weight:700; font-size:15px;
    display:flex; align-items:center; gap:8px}
  details.faq summary::-webkit-details-marker{display:none}
  details.faq summary::after{content:'+'; margin-left:auto; color:var(--ink-faint); font-size:18px; font-weight:400}
  details.faq[open] summary::after{content:'−'}
  details.faq .a{padding:0 16px 14px; color:var(--ink-soft); font-size:14.5px; white-space:pre-wrap}

  .empty{color:var(--ink-faint); font-size:14px; text-align:center; padding:16px 0}
  .foot{margin-top:30px; text-align:center; color:var(--ink-faint); font-size:12.5px; line-height:1.7}
  .foot a{color:var(--ink-faint)}
  /* 학원 이름을 글자 대신 로고로. 로그인 화면과 같은 크기(124px)로 맞춘다. */
  .foot img{width:124px; height:auto; display:block; margin:0 auto 10px}
  /* 어두운 화면에서는 로고가 배경에 묻혀서 살짝 띄운다 */
  @media (prefers-color-scheme:dark){.foot img{filter:brightness(1.9) contrast(.95)}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>리디튜드 안내</h1>
    <p class="lede">학사일정 · 신청 · 공지사항</p>
  </div>

  <section id="schedule" hidden>
    <h2><span class="ico">📅</span>학사일정</h2>
    <div class="calnav" id="calNav" hidden>
      <button type="button" id="calPrev">◀</button>
      <span class="m" id="calMonthLabel"></span>
      <button type="button" id="calNext">▶</button>
    </div>
    <div id="schList"></div>
  </section>

  <section id="news" hidden>
    <h2><span class="ico">📢</span>공지 · 소식</h2>
    <div id="newsList"></div>
  </section>

  <section id="forms">
    <h2><span class="ico">📝</span>신청하기</h2>
    <div id="formList"></div>
  </section>

  <section id="faq" hidden>
    <h2><span class="ico">💬</span>자주 묻는 질문</h2>
    <div id="faqList"></div>
  </section>

  <div id="loading" class="empty">불러오는 중…</div>

  <p class="foot">
    <img src="/assets/logo.png" alt="리디튜드 영어학원">
    더 궁금한 점은 카카오톡 채널로 문의해 주세요.
  </p>

</div>

<!-- ?v= 는 그림 코드를 고칠 때마다 올린다. 안 올리면 브라우저·카톡 웹뷰가 예전 파일을 그대로 써서 고친 게 안 보인다 -->
<script src="/assets/readi-calendar.js?v=20260930-2"></script>
<script>
const WD = ['일','월','화','수','목','금','토'];

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// 노션 URL 칸에 http(s) 외의 것이 들어오면 링크로 만들지 않는다.
function safeUrl(u){
  if(!u) return '';
  try{
    const p = new URL(u, location.origin).protocol;
    return (p === 'http:' || p === 'https:') ? u : '';
  }catch(_){ return ''; }
}

function ymd(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function fmtDay(iso){
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WD[d.getDay()] + ')';
}

function fmtRange(start, end){
  if(!start) return '';
  if(!end || end === start) return fmtDay(start);
  const a = new Date(start + 'T00:00:00'), b = new Date(end + 'T00:00:00');
  if(isNaN(a) || isNaN(b)) return fmtDay(start);
  const sameMonth = a.getMonth() === b.getMonth();
  return (a.getMonth()+1) + '월 ' + a.getDate() + '일 ~ ' + (sameMonth ? '' : (b.getMonth()+1) + '월 ') + b.getDate() + '일';
}

function fmtShort(iso){
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return '';
  return (d.getMonth()+1) + '.' + d.getDate();
}

// ── 학사일정 달력 ─────────────────────────────
// 원장이 /calendar 에서 찍은 휴강·이벤트·시험기간·보강일을 학부모 화면에도 그대로 그린다.
// 달력 이미지를 매달 만들어 올리지 않아도 되게 하려는 것이다.
// 그리는 코드는 /assets/readi-calendar.js — 원장 달력의 "이미지로 저장"과 같은 그림이다.
const CAL_TYPES = ['휴강', '이벤트', '시험기간', '보강일'];

let NOTICE_ITEMS = [];
let calCursor = new Date();

function renderSchedule(){
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const prefix = y + '-' + String(m+1).padStart(2,'0');
  const today = ymd(new Date());

  // 원장이 손으로 만든 달력 이미지를 올렸으면 그것을 우선한다.
  const cal = NOTICE_ITEMS
    .filter(it => it.type === '학사일정' && it.image)
    .sort((a,b) => String(b.start).localeCompare(String(a.start)))[0];

  let html = '';
  if(cal && safeUrl(cal.image)){
    const src = safeUrl(cal.image);
    html += '<a class="cal" href="'+esc(src)+'" target="_blank" rel="noopener">'
      + '<img src="'+esc(src)+'" alt="'+esc(cal.title || '학사일정')+'"></a>';
    if(cal.title) html += '<p class="calcap">'+esc(cal.title)+' · 눌러서 크게 보기</p>';
  } else {
    // 오른쪽 위 트랙별 횟수와, 목표에 못 미치는 달에 원장이 남긴 안내 문구
    const notes = {};
    NOTICE_ITEMS.filter(it => it.type === ReadiCal.NOTE_TYPE && it.start === prefix + '-01' && it.body)
      .forEach(it => { notes[it.title] = it.body; });
    const calItems = NOTICE_ITEMS.filter(it => CAL_TYPES.includes(it.type) && it.start);
    html += '<div class="calbox">' + ReadiCal.draw({
      year: y, month: m, items: calItems,
      counts: ReadiCal.countSessions(y, m, calItems), notes,
    }) + '</div>';
  }

  // 그 달에 적힌 설명(휴강 사유 등)과 제목이 따로 있는 일정만 아래에 덧붙인다.
  // 보강일은 시간만 적혀 있어도 띄운다 — 언제 오는지가 학부모에게 제일 중요한 정보다.
  // 이 달에 걸치는 일정을 모은다. 지난달에서 넘어온 방학도 이 달 목록에 보여야 한다.
  const monthFrom = prefix + '-01';
  const monthTo = (m === 11 ? (y+1) + '-01' : y + '-' + String(m+2).padStart(2,'0')) + '-01';
  const list = NOTICE_ITEMS
    .filter(it => it.start && it.start < monthTo && (it.end || it.start) >= monthFrom)
    // 이름을 지어 준 휴강·행사는 설명이 없어도 띄운다.
    // 달력의 점만으로는 "학원방학"인지 알 수 없어서 결국 학원에 물어보게 된다.
    .filter(it => (it.type === '학사일정' && !it.image)
      || ((it.type === '휴강' || it.type === '이벤트' || it.type === '시험기간') && (it.body || (it.title && it.title !== it.type)))
      || (it.type === '보강일' && (it.time || it.body)))
    .sort((a,b) => a.start.localeCompare(b.start));

  if(list.length){
    html += '<div class="card">' + list.map(it => {
      const isToday = it.start <= today && (it.end || it.start) >= today;
      const badge = it.type === '휴강' ? '<span class="tag off">휴강</span>'
        : it.type === '이벤트' ? '<span class="tag ev">행사</span>'
        : it.type === '시험기간' ? '<span class="tag ex">시험</span>'
        : it.type === '보강일' ? '<span class="tag mk">보강</span>' : '';
      // 달력에서 찍은 표시는 제목이 유형 이름 그대로("휴강")라 다시 보여줄 필요가 없다
      const label = (it.title === it.type) ? '' : esc(it.title);
      const memo = it.type === '보강일'
        ? [it.time, it.body].filter(Boolean).join(' · ')
        : it.body;
      return '<div class="sch'+(isToday?' today':'')+'">'
        + '<div class="when">'+esc(fmtRange(it.start, it.end))+'</div>'
        + '<div><div class="what">'+badge+label+'</div>'
        + (memo ? '<div class="memo">'+esc(memo)+'</div>' : '')
        + '</div></div>';
    }).join('') + '</div>';
  }

  document.getElementById('schList').innerHTML = html;
  document.getElementById('calMonthLabel').textContent = y + '년 ' + (m+1) + '월';
  document.getElementById('calNav').hidden = !!cal;   // 이미지를 올렸으면 월 이동은 의미가 없다
  document.getElementById('schedule').hidden = false;
}

function render(data){
  const items = data.items || [];
  const today = ymd(new Date());

  // ── 신청하기 ─────────────────────────────
  // 폼 주소가 아직 없으면 링크로 만들지 않고 "준비 중"으로 둔다.
  document.getElementById('formList').innerHTML = (data.forms || []).map(f => {
    const url = safeUrl(f.url);
    const inner =
      '<div><div class="t">' + esc(f.label) + '</div><div class="d">' + esc(f.desc) + '</div></div>' +
      '<div class="go">' + (url ? '›' : '준비 중') + '</div>';
    return url
      ? '<a class="form" href="' + esc(url) + '" target="_blank" rel="noopener">' + inner + '</a>'
      : '<div class="form off">' + inner + '</div>';
  }).join('');

  // ── 학사일정 ─────────────────────────────
  NOTICE_ITEMS = items;
  renderSchedule();

  // ── 공지 · 소식 ──────────────────────────
  const posts = items
    .filter(it => it.type === '공지' || it.type === '뉴스')
    .sort((a,b) => (b.pinned - a.pinned) || String(b.start).localeCompare(String(a.start)))
    .slice(0, 20);

  if(posts.length){
    document.getElementById('newsList').innerHTML = posts.map(it => {
      const url = safeUrl(it.link);
      return '<div class="card post">' +
        '<div class="h">' +
          '<span class="tag' + (it.type === '뉴스' ? ' news' : '') + '">' + (it.pinned ? '📌 ' : '') + esc(it.type) + '</span>' +
          (it.start ? '<span class="date">' + esc(fmtShort(it.start)) + '</span>' : '') +
        '</div>' +
        '<div class="t">' + esc(it.title) + '</div>' +
        (it.body ? '<div class="b">' + esc(it.body) + '</div>' : '') +
        (url ? '<a class="more" href="' + esc(url) + '" target="_blank" rel="noopener">자세히 보기 ›</a>' : '') +
      '</div>';
    }).join('');
    document.getElementById('news').hidden = false;
  }

  // ── 자주 묻는 질문 ───────────────────────
  // 노션은 정렬을 보장하지 않는다. '고정'을 체크한 질문이 위로 오게 해서
  // 자주 나오는 질문을 원장이 직접 올릴 수 있게 한다.
  const faqs = items.filter(it => it.type === 'FAQ').sort((a,b) => b.pinned - a.pinned);
  if(faqs.length){
    document.getElementById('faqList').innerHTML = faqs.map(it =>
      '<details class="faq"><summary>' + esc(it.title) + '</summary>' +
      '<div class="a">' + esc(it.body) + '</div></details>'
    ).join('');
    document.getElementById('faq').hidden = false;
  }

  document.getElementById('loading').hidden = true;

  // 카카오톡 메뉴가 #faq 처럼 특정 섹션을 지목해 열 수 있으므로,
  // 내용을 그린 다음에 한 번 더 스크롤을 맞춘다.
  if(location.hash){
    const el = document.querySelector(location.hash);
    if(el) el.scrollIntoView({ block:'start' });
  }
}

document.getElementById('calPrev').onclick = () => {
  calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1);
  renderSchedule();
};
document.getElementById('calNext').onclick = () => {
  calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1);
  renderSchedule();
};

// 학원 내부 안내라 로그인한 사람만 본다. 카톡 채널 메뉴에 주소가 걸려 있어서
// 주소만 알면 누구나 보던 것을 막는다.
// 학부모·학생은 리디플랜 계정(authToken), 선생님은 teacher_auth_token 을 쓴다.
const token = localStorage.getItem('authToken') || localStorage.getItem('teacher_auth_token');

function toLogin() {
  location.replace('/?next=' + encodeURIComponent('/notice'));
}

if (!token) {
  toLogin();
} else {
  fetch('/api/notice', { headers: { Authorization: 'Bearer ' + token } })
    .then(r => {
      // 토큰이 만료됐으면 붙잡고 있어 봐야 계속 막힌다. 지우고 다시 로그인시킨다.
      if (r.status === 401) {
        localStorage.removeItem('authToken');
        localStorage.removeItem('teacher_auth_token');
        toLogin();
        return null;
      }
      return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status));
    })
    .then(d => { if (d) render(d); })
    .catch(err => {
      console.error(err);
      // 공지를 못 불러와도 신청 링크는 보여야 한다.
      render({ items: [], forms: [] });
      document.getElementById('loading').hidden = false;
      document.getElementById('loading').textContent = '잠시 후 다시 열어 주세요.';
    });
}
</script>
</body>
</html>
