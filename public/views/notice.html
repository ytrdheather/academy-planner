<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d9488">
<title>리디튜드 안내 · 공지사항</title>
<style>
  :root{
    --bg:#f4f7f7; --surface:#ffffff; --surface-2:#eef3f3;
    --ink:#17242e; --ink-soft:#485a68; --ink-faint:#7b8b98;
    --border:#e0e8ea; --border-strong:#cdd9db;
    --accent:#0d9488; --accent-ink:#0a6c62; --accent-wash:#e4f3f0;
    --warn:#a15b06; --warn-wash:#fdf0dd; --warn-border:#f4d9b0;
    --shadow:0 1px 2px rgba(20,40,55,.04),0 6px 20px rgba(20,40,55,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e161b; --surface:#161f26; --surface-2:#1c272f;
      --ink:#e7eef2; --ink-soft:#a7b7c2; --ink-faint:#6d7f8c;
      --border:#243139; --border-strong:#31424c;
      --accent:#2dd4bf; --accent-ink:#7ee7d8; --accent-wash:rgba(45,212,191,.12);
      --warn:#f0b657; --warn-wash:rgba(240,182,87,.12); --warn-border:rgba(240,182,87,.28);
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  [hidden]{display:none!important}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
    line-height:1.62; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px; margin:0 auto; padding:22px 16px 56px}

  .top{text-align:center; padding:6px 0 18px}
  h1{font-size:23px; margin:0 0 6px; letter-spacing:-.4px}
  .lede{margin:0; color:var(--ink-soft); font-size:15px}

  section{margin:22px 0 0}
  h2{font-size:17px; margin:0 0 10px; letter-spacing:-.3px; display:flex; align-items:center; gap:7px}
  h2 .ico{font-size:18px}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px;
        padding:14px 16px; margin:10px 0; box-shadow:var(--shadow)}

  /* 신청 버튼 */
  a.form{display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; margin:10px 0; box-shadow:var(--shadow)}
  a.form:active{background:var(--surface-2)}
  .form .t{font-weight:700; font-size:15.5px}
  .form .d{color:var(--ink-faint); font-size:13.5px; margin-top:1px}
  .form .go{margin-left:auto; color:var(--accent-ink); font-weight:800; font-size:18px}
  .form.off{opacity:.55}
  .form.off .go{font-size:12.5px; font-weight:700; color:var(--ink-faint)}

  /* 학사일정 */
  .sch{display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--border)}
  .sch:last-child{border-bottom:0}
  .sch .when{flex:0 0 84px; color:var(--accent-ink); font-weight:800; font-size:13.5px; padding-top:1px}
  .sch .what{font-size:15px}
  .sch .memo{color:var(--ink-faint); font-size:13.5px; margin-top:1px}
  .sch.today .when::after{content:'오늘'; display:inline-block; margin-left:5px; padding:0 5px;
    border-radius:5px; background:var(--accent-ink); color:#fff; font-size:11px}

  /* 공지·뉴스 */
  .post .h{display:flex; align-items:center; gap:7px; margin-bottom:3px}
  .tag{display:inline-block; padding:1px 7px; border-radius:999px; font-size:11.5px; font-weight:800;
       background:var(--accent-wash); color:var(--accent-ink)}
  .tag.news{background:var(--warn-wash); color:var(--warn)}
  .post .t{font-weight:700; font-size:15.5px; letter-spacing:-.2px}
  .post .date{color:var(--ink-faint); font-size:12.5px; margin-left:auto; flex:0 0 auto}
  .post .b{color:var(--ink-soft); font-size:14.5px; white-space:pre-wrap; margin-top:5px}
  .post a.more{display:inline-block; margin-top:8px; color:var(--accent-ink); font-weight:700; font-size:14px}

  /* FAQ */
  details.faq{background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:0; margin:8px 0; box-shadow:var(--shadow); overflow:hidden}
  details.faq summary{list-style:none; cursor:pointer; padding:13px 16px; font-weight:700; font-size:15px;
    display:flex; align-items:center; gap:8px}
  details.faq summary::-webkit-details-marker{display:none}
  details.faq summary::after{content:'+'; margin-left:auto; color:var(--ink-faint); font-size:18px; font-weight:400}
  details.faq[open] summary::after{content:'−'}
  details.faq .a{padding:0 16px 14px; color:var(--ink-soft); font-size:14.5px; white-space:pre-wrap}

  .empty{color:var(--ink-faint); font-size:14px; text-align:center; padding:16px 0}
  .foot{margin-top:30px; text-align:center; color:var(--ink-faint); font-size:12.5px; line-height:1.7}
  .foot a{color:var(--ink-faint)}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>리디튜드 안내</h1>
    <p class="lede">학사일정 · 신청 · 공지사항</p>
  </div>

  <section id="forms">
    <h2><span class="ico">📝</span>신청하기</h2>
    <div id="formList"></div>
  </section>

  <section id="schedule" hidden>
    <h2><span class="ico">📅</span>학사일정</h2>
    <div class="card" id="schList"></div>
  </section>

  <section id="news" hidden>
    <h2><span class="ico">📢</span>공지 · 소식</h2>
    <div id="newsList"></div>
  </section>

  <section id="faq" hidden>
    <h2><span class="ico">💬</span>자주 묻는 질문</h2>
    <div id="faqList"></div>
  </section>

  <div id="loading" class="empty">불러오는 중…</div>

  <p class="foot">
    리디튜드 영어학원<br>
    더 궁금한 점은 카카오톡 채널로 문의해 주세요.
  </p>

</div>

<script>
const WD = ['일','월','화','수','목','금','토'];

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// 노션 URL 칸에 http(s) 외의 것이 들어오면 링크로 만들지 않는다.
function safeUrl(u){
  if(!u) return '';
  try{
    const p = new URL(u, location.origin).protocol;
    return (p === 'http:' || p === 'https:') ? u : '';
  }catch(_){ return ''; }
}

function ymd(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function fmtDay(iso){
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WD[d.getDay()] + ')';
}

function fmtRange(start, end){
  if(!start) return '';
  if(!end || end === start) return fmtDay(start);
  const a = new Date(start + 'T00:00:00'), b = new Date(end + 'T00:00:00');
  if(isNaN(a) || isNaN(b)) return fmtDay(start);
  const sameMonth = a.getMonth() === b.getMonth();
  return (a.getMonth()+1) + '월 ' + a.getDate() + '일 ~ ' + (sameMonth ? '' : (b.getMonth()+1) + '월 ') + b.getDate() + '일';
}

function fmtShort(iso){
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return '';
  return (d.getMonth()+1) + '.' + d.getDate();
}

function render(data){
  const items = data.items || [];
  const today = ymd(new Date());

  // ── 신청하기 ─────────────────────────────
  // 폼 주소가 아직 없으면 링크로 만들지 않고 "준비 중"으로 둔다.
  document.getElementById('formList').innerHTML = (data.forms || []).map(f => {
    const url = safeUrl(f.url);
    const inner =
      '<div><div class="t">' + esc(f.label) + '</div><div class="d">' + esc(f.desc) + '</div></div>' +
      '<div class="go">' + (url ? '›' : '준비 중') + '</div>';
    return url
      ? '<a class="form" href="' + esc(url) + '" target="_blank" rel="noopener">' + inner + '</a>'
      : '<div class="form off">' + inner + '</div>';
  }).join('');

  // ── 학사일정 ─────────────────────────────
  // 지난 일정은 감춘다. 기간 일정은 종료일까지 남긴다.
  const sch = items
    .filter(it => it.type === '학사일정' && it.start && (it.end || it.start) >= today)
    .sort((a,b) => a.start.localeCompare(b.start))
    .slice(0, 10);

  if(sch.length){
    document.getElementById('schList').innerHTML = sch.map(it => {
      const isToday = it.start <= today && (it.end || it.start) >= today;
      return '<div class="sch' + (isToday ? ' today' : '') + '">' +
        '<div class="when">' + esc(fmtRange(it.start, it.end)) + '</div>' +
        '<div><div class="what">' + esc(it.title) + '</div>' +
        (it.body ? '<div class="memo">' + esc(it.body) + '</div>' : '') +
        '</div></div>';
    }).join('');
    document.getElementById('schedule').hidden = false;
  }

  // ── 공지 · 소식 ──────────────────────────
  const posts = items
    .filter(it => it.type === '공지' || it.type === '뉴스')
    .sort((a,b) => (b.pinned - a.pinned) || String(b.start).localeCompare(String(a.start)))
    .slice(0, 20);

  if(posts.length){
    document.getElementById('newsList').innerHTML = posts.map(it => {
      const url = safeUrl(it.link);
      return '<div class="card post">' +
        '<div class="h">' +
          '<span class="tag' + (it.type === '뉴스' ? ' news' : '') + '">' + (it.pinned ? '📌 ' : '') + esc(it.type) + '</span>' +
          (it.start ? '<span class="date">' + esc(fmtShort(it.start)) + '</span>' : '') +
        '</div>' +
        '<div class="t">' + esc(it.title) + '</div>' +
        (it.body ? '<div class="b">' + esc(it.body) + '</div>' : '') +
        (url ? '<a class="more" href="' + esc(url) + '" target="_blank" rel="noopener">자세히 보기 ›</a>' : '') +
      '</div>';
    }).join('');
    document.getElementById('news').hidden = false;
  }

  // ── 자주 묻는 질문 ───────────────────────
  // 노션은 정렬을 보장하지 않는다. '고정'을 체크한 질문이 위로 오게 해서
  // 자주 나오는 질문을 원장이 직접 올릴 수 있게 한다.
  const faqs = items.filter(it => it.type === 'FAQ').sort((a,b) => b.pinned - a.pinned);
  if(faqs.length){
    document.getElementById('faqList').innerHTML = faqs.map(it =>
      '<details class="faq"><summary>' + esc(it.title) + '</summary>' +
      '<div class="a">' + esc(it.body) + '</div></details>'
    ).join('');
    document.getElementById('faq').hidden = false;
  }

  document.getElementById('loading').hidden = true;

  // 카카오톡 메뉴가 #faq 처럼 특정 섹션을 지목해 열 수 있으므로,
  // 내용을 그린 다음에 한 번 더 스크롤을 맞춘다.
  if(location.hash){
    const el = document.querySelector(location.hash);
    if(el) el.scrollIntoView({ block:'start' });
  }
}

fetch('/api/notice')
  .then(r => r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)))
  .then(render)
  .catch(err => {
    console.error(err);
    // 공지를 못 불러와도 신청 링크는 보여야 한다.
    render({ items: [], forms: [] });
    document.getElementById('loading').hidden = false;
    document.getElementById('loading').textContent = '잠시 후 다시 열어 주세요.';
  });
</script>
</body>
</html>
