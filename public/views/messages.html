<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>알림톡 발송함 · 리디튜드</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#fff; --ink:#1c1e21; --ink-soft:#5b6169; --ink-faint:#8b929b;
    --border:#e4e7eb; --accent:#2d6cdf; --ok:#129d6f; --bad:#c0392b;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#16181c; --surface:#1f2228; --ink:#eceef1; --ink-soft:#aab1ba; --ink-faint:#7d858f;
          --border:#2f343c; --ok:#3ddca0; --bad:#ff8a7a}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;padding:20px 16px 60px}
  .wrap{max-width:680px;margin:0 auto}
  header{margin-bottom:18px}
  .eyebrow{font-size:12.5px;color:var(--ink-faint);font-weight:700;letter-spacing:.04em}
  h1{font-size:22px;margin:4px 0 6px}
  .sum{color:var(--ink-soft);font-size:14px}
  .sum b{color:var(--ink)}
  .bar{display:flex;gap:8px;margin:14px 0 4px}
  input[type=search]{flex:1;min-width:0;font:inherit;border:1px solid var(--border);background:var(--surface);
        color:var(--ink);border-radius:9px;padding:9px 12px}
  button{font:inherit;font-weight:650;border:1px solid var(--border);background:var(--surface);
         color:var(--ink);border-radius:9px;padding:9px 14px;cursor:pointer;flex:none}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  ul{list-style:none;padding:0;margin:16px 0 0;border:1px solid var(--border);
     border-radius:13px;overflow:hidden;background:var(--surface)}
  li{border-top:1px solid var(--border);padding:14px 16px}
  li:first-child{border-top:none}
  .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
  .kind{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;
        background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
  .kind.sms{background:color-mix(in srgb,var(--ink-faint) 16%,transparent);color:var(--ink-soft)}
  .when{font-size:12.5px;color:var(--ink-faint)}
  .to{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .st{font-size:12px;font-weight:800;margin-left:auto}
  .st.ok{color:var(--ok)}
  .st.bad{color:var(--bad)}
  /* 실제로 나간 글자를 줄바꿈 그대로 보여 준다. 이게 이 페이지의 존재 이유다. */
  .text{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.6;color:var(--ink)}
  .why{margin-top:6px;font-size:13px;color:var(--bad)}
  .msg{color:var(--ink-soft);font-size:14.5px;padding:28px 4px;text-align:center;line-height:1.7}
  footer{margin-top:20px;color:var(--ink-faint);font-size:12.5px;text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">리디튜드 · 리디플랜</div>
    <h1>알림톡 발송함</h1>
    <div class="sum" id="sum">불러오는 중…</div>
  </header>

  <div class="bar">
    <input type="search" id="q" placeholder="학생 이름 또는 전화번호" autocomplete="off">
    <button class="primary" id="go">찾기</button>
  </div>

  <div id="out"></div>

  <footer>
    솔라피에 남은 <b>실제 발송 기록</b>입니다. 변수가 채워진 최종 문구가 그대로 보입니다.<br>
    번호로 찾으면 그 번호로 간 것만, 이름으로 찾으면 최근 500건 중 본문에 그 이름이 든 것만 나옵니다.
  </footer>
</div>

<script>
  const token = localStorage.getItem('teacher_auth_token') || localStorage.getItem('authToken');
  const out = document.getElementById('out');
  const sum = document.getElementById('sum');
  const q = document.getElementById('q');

  const 시각 = s => {
    if (!s) return '';
    // 솔라피는 UTC 로 준다. 우리가 보는 시각은 KST 다.
    const d = new Date(s);
    return new Intl.DateTimeFormat('ko-KR', {
      month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit',
      hour12: false, timeZone: 'Asia/Seoul',
    }).format(d);
  };
  const 번호 = n => String(n || '').replace(/^(\d{2,3})(\d{3,4})(\d{4})$/, '$1-$2-$3');

  function render(목록) {
    out.textContent = '';
    if (!목록.length) {
      out.innerHTML = '<div class="msg">해당하는 발송 기록이 없습니다.</div>';
      return;
    }
    const ul = document.createElement('ul');
    for (const m of 목록) {
      const li = document.createElement('li');
      const top = document.createElement('div');
      top.className = 'top';

      const kind = document.createElement('span');
      kind.className = 'kind' + (m.종류 === '문자' ? ' sms' : '');
      kind.textContent = m.종류;

      const when = document.createElement('span');
      when.className = 'when';
      when.textContent = 시각(m.일시);

      const to = document.createElement('span');
      to.className = 'to';
      to.textContent = 번호(m.받는사람);

      const st = document.createElement('span');
      st.className = 'st ' + (m.성공 ? 'ok' : 'bad');
      st.textContent = m.성공 ? '전달됨' : '실패';

      top.append(kind, when, to, st);

      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = m.본문 || '(본문 없음)';

      li.append(top, text);
      if (!m.성공) {
        const why = document.createElement('div');
        why.className = 'why';
        why.textContent = (m.실패사유 || '') + ' (코드 ' + m.상태코드 + ')';
        li.append(why);
      }
      ul.append(li);
    }
    out.append(ul);
  }

  async function load() {
    if (!token) { sum.textContent = '로그인이 필요합니다.'; out.innerHTML = '<div class="msg">리디플랜에 로그인한 뒤 다시 열어 주세요.</div>'; return; }
    sum.textContent = '불러오는 중…';
    try {
      const r = await fetch('/api/messages/sent?q=' + encodeURIComponent(q.value.trim()), {
        headers: { Authorization: 'Bearer ' + token },
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      const 실패 = d.목록.filter(m => !m.성공).length;
      sum.innerHTML = '<b>' + d.목록.length + '건</b>' + (실패 ? ' · 실패 <b>' + 실패 + '건</b>' : '');
      render(d.목록);
    } catch (e) {
      sum.textContent = '불러오지 못했습니다.';
      out.innerHTML = '<div class="msg">' + e.message + '</div>';
    }
  }

  document.getElementById('go').addEventListener('click', load);
  q.addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
  load();
</script>
</body>
</html>
