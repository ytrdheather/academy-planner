<svg width="512" height="512" viewBox="0 0 512 512" role="img" xmlns="http://www.w3.org/2000/svg">
<title>리디플랜 앱 아이콘</title>
<desc>체크리스트 보드를 든 부엉이 마스코트 정사각형 아이콘</desc>

<!-- 배경: 매니페스트 background_color와 동일한 크림색 -->
<rect width="512" height="512" fill="#f9f7f2"/>

<!-- 가로형 로고에서 부엉이+보드만 떼어내 정사각형에 맞게 확대(원본 좌표계 52,62 ~ 262,272) -->
<g transform="translate(256 256) scale(2.438) translate(-157 -167)">
  <!-- 바닥 그림자 -->
  <ellipse cx="150" cy="215" rx="86" ry="30" fill="#d3dedb"/>

  <!-- 몸통 + 귀 -->
  <path d="M150 108 C102 108 84 150 84 182 C84 216 112 238 150 238 C188 238 216 216 216 182 C216 150 198 108 150 108 Z" fill="#c8cfc7" stroke="#2b3b42" stroke-width="2.6"/>
  <path d="M96 120 C88 100 96 86 108 88 C112 100 110 112 104 120 Z" fill="#c8cfc7" stroke="#2b3b42" stroke-width="2.6"/>
  <path d="M204 120 C212 100 204 86 192 88 C188 100 190 112 196 120 Z" fill="#c8cfc7" stroke="#2b3b42" stroke-width="2.6"/>
  <path d="M150 120 C126 130 116 152 116 170 C132 176 142 172 150 164 C158 172 168 176 184 170 C184 152 174 130 150 120 Z" fill="#eef2ee"/>

  <!-- 눈 · 부리 -->
  <circle cx="126" cy="158" r="21" fill="#fbf6ee" stroke="#2b3b42" stroke-width="2.4"/>
  <circle cx="174" cy="158" r="21" fill="#fbf6ee" stroke="#2b3b42" stroke-width="2.4"/>
  <circle cx="126" cy="159" r="9" fill="#a86a1e"/>
  <circle cx="174" cy="159" r="9" fill="#a86a1e"/>
  <circle cx="123" cy="156" r="3" fill="#fff"/>
  <circle cx="171" cy="156" r="3" fill="#fff"/>
  <polygon points="150,168 142,178 158,178" fill="#e08a2b" stroke="#2b3b42" stroke-width="1.6"/>

  <!-- 체크리스트 보드 -->
  <g transform="rotate(-9 205 205)">
    <rect x="176" y="168" width="72" height="86" rx="8" fill="#f6efe1" stroke="#2b3b42" stroke-width="2.6"/>
    <rect x="196" y="160" width="32" height="14" rx="6" fill="#a9c39f" stroke="#2b3b42" stroke-width="2.4"/>
    <line x1="190" y1="192" x2="234" y2="192" stroke="#b7c0bc" stroke-width="3" stroke-linecap="round"/>
    <line x1="190" y1="210" x2="234" y2="210" stroke="#b7c0bc" stroke-width="3" stroke-linecap="round"/>
    <line x1="190" y1="228" x2="222" y2="228" stroke="#b7c0bc" stroke-width="3" stroke-linecap="round"/>
    <path d="M184 190 l5 5 l9 -11" fill="none" stroke="#0d9488" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M184 208 l5 5 l9 -11" fill="none" stroke="#0d9488" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>
</svg>
